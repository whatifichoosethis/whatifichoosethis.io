async function ai(system,prompt,json){
 if(CL)return json?CL.json(system+'\n\n'+prompt,{cache:false}):(await CL(system+'\n\n'+prompt,{cache:false})).text;
 if(!CFG.ENDPOINT)throw 'noai';
 const c=new AbortController(),tm=setTimeout(()=>c.abort(),35000);
 try{
  const r=await fetch(CFG.ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({system,prompt,json:!!json}),signal:c.signal});
  const d=await r.json().catch(()=>({}));
  if(!r.ok){
    const err=new Error(d.text||d.error||('http'+r.status));
    err.status=r.status;err.code=d.error;throw err;
  }
  if(!d.text)throw 'empty';
  return json?JSON.parse(String(d.text).replace(/```json|```/g,'').trim()):d.text;
 }finally{clearTimeout(tm)}
}

function before(){
 return`<p><a href="#home">← Home</a></p><h1>Before You Choose</h1>
<p class="m">Simple guidance for Class 9–12 students and parents. Not personal counselling.</p>
<div class="card"><h2>What to consider before selecting a stream</h2>
<ul><li>Which subjects you understand and enjoy enough to study for two years.</li>
<li>Whether a career you care about truly requires a specific subject (many do not).</li>
<li>Your school’s available combinations and teachers – practical constraints matter.</li>
<li>Backup options if a competitive entrance does not go as planned.</li></ul></div>
<div class="card"><h2>Common misconceptions</h2>
<ul><li><b>Science is the only “safe” stream.</b> Commerce and Humanities lead to law, CA, civil services, design, media and more.</li>
<li><b>Humanities means fewer careers.</b> Many competitive exams after graduation are open to any degree.</li>
<li><b>Without Mathematics you cannot succeed in business.</b> CA, CS, CMA and most B.Com/BBA routes do not require Class 12 Mathematics – verify each course.</li>
<li><b>One entrance exam defines your life.</b> Multiple degree and career routes exist; plans can change.</li></ul></div>
<div class="card"><h2>Can you change streams later?</h2>
<p>Switching subjects after Class 11 is often limited by school and board rules. After Class 12, many undergraduate programmes accept more than one stream – always read the official eligibility list. Diploma holders may use lateral entry to engineering in some states – verify.</p></div>
<div class="card"><h2>Skills alongside degrees</h2>
<p>Communication, writing, basic data skills, and honesty in your work help in every field. Degrees open doors; skills and consistency help you walk through them. Free learning platforms such as ${lk('swayam')} and ${lk('nptel')} can support study – they do not replace official eligibility.</p></div>
<div class="card"><h2>How to research colleges</h2>
<ul><li>Check recognition: ${lk('ugc')}, ${lk('aicte')}, ${lk('nmc')} (medical), ${lk('coan')} where relevant.</li>
<li>Read the latest prospectus PDF on the college or university site – not only social media.</li>
<li>Treat placement posters and “100% package” claims with caution; ask for verifiable data.</li>
<li>${lk('nirf')} rankings are one input, not a complete quality measure.</li></ul></div>
<div class="card"><h2>Fake claims to watch for</h2>
<ul><li>Guaranteed seats, ranks or jobs in exchange for fees.</li>
<li>Unofficial “management quota” stories that conflict with published rules.</li>
<li>Coaching centres claiming ownership of official cut-offs.</li></ul>
<p class="warn">If someone pressures you to pay quickly without written official rules, pause and verify with a trusted adult and the institution’s public notice.</p></div>
<p><a class="btn" href="#become">Explore careers</a> <a class="btn o" href="#pathways">See pathways</a></p>`;
}
const CH={},QI={},LASTQ={};
function chat(key,focus){
 const ready=hasAI();
 const setup = ready ? '' : `<div class="card" style="border-color:var(--warn)">
<h3>Why AI is not working yet</h3>
<p>The chat UI is ready, but it has <b>no secure server address</b> configured. The Gemini API key must stay on a Cloudflare Worker — never inside this HTML file.</p>
<ol>
<li>Deploy <code>worker.js</code> on Cloudflare Workers (free).</li>
<li>Add secret <code>GEMINI_API_KEY</code> and variable <code>MODEL=gemini-3.5-flash-lite</code>.</li>
<li>Copy the Worker URL (ends with <code>.workers.dev</code>).</li>
<li>In <code>index.html</code> set:<br><code>const CFG={ENDPOINT:'https://YOUR-WORKER.workers.dev'};</code></li>
<li>Re-upload <code>index.html</code> and refresh this page.</li>
</ol>
<p class="m">Full steps are in <b>SETUP.md</b>. Until then you can still use pathways, careers and official links.</p>
</div>`;
 return setup+`<div class="card"><h2>💬 Ask AI${focus?' about '+esc(focus):''}</h2>
<p class="m">AI status: <b>${aiName()}</b>. ${ready?'Questions go to Gemini through your secure Worker.':'Blocked until CFG.ENDPOINT points to your Worker.'}</p>
<div class="warn"><b>AI-generated guidance may contain errors.</b> Always verify important educational information through official sources. Never share passwords, Aadhaar, phone, home address or exam roll numbers in chat.</div>
<div id="ch-${key}"></div>
<label for="qi-${key}">Your question</label>
<textarea id="qi-${key}" rows="2" maxlength="500" placeholder="e.g. Can I pursue law after PCB?" ${ready?'':'disabled'}></textarea>
<p><button type="button" class="btn" id="sb-${key}" onclick="send('${key}','${esc(focus||'general guidance')}')" ${ready?'':'disabled'}>${ready?'Send':'AI not configured'}</button>
<button type="button" class="btn o" id="rt-${key}" style="display:none" onclick="retryLast('${key}','${esc(focus||'general guidance')}')">Retry</button></p></div>`;
}
function draw(key){const e=$('#ch-'+key);if(!e)return;e.innerHTML=(CH[key]||[]).map(m=>`<div class="bu${m.r==='u'?' me':''}"><small>${m.r==='u'?'You':'Adviser'}</small><br>${m.pending?'<span class="loading">Thinking</span>':(clean(m.c)||'')}</div>`).join('')}
async function send(key,focus,q){
 const el=$('#qi-'+key);q=q||(el&&el.value.trim());if(!q)return;if(el)el.value='';
 const h=CH[key]=CH[key]||[];h.push({r:'u',c:q});h.push({r:'a',c:'',pending:true});LASTQ[key]=q;draw(key);
 const b=$('#sb-'+key),rt=$('#rt-'+key);if(b)b.disabled=true;if(rt)rt.style.display='none';
 const p=pw();
 const tx=h.filter(m=>!m.pending).map(m=>(m.r==='u'?'Student: ':'Adviser: ')+m.c).join('\n');
 const pr=`Student context: pathway = ${p?p.n:'not selected'}; subjects = ${p?p.s:'n/a'}; level = ${PA.lv||'not set'}; country = ${PA.c}. Focus: ${focus}.
Background (general, unverified): ${p?`exams = ${p.ex.map(e=>e[0]).join(', ')}; degrees = ${p.dg.map(d=>d.split(/ [–(]/)[0]).join(', ')}`:'browse mode'}.
APPROVED LINKS:
${Object.values(L).map(x=>x[0]+': '+x[1]).join('\n')}

Conversation:
${tx}
Adviser:`;
 try{
  h[h.length-1].c=await ai(INSTR,pr,false);h[h.length-1].pending=false;AI_LIVE=true;
 }catch(e){
  h[h.length-1].pending=false;
  const msg=String(e&&e.message||e);
  h[h.length-1].c=e==='noai'
   ?'AI is not configured. Open SETUP.md and: (1) deploy worker.js on Cloudflare, (2) add GEMINI_API_KEY secret, (3) set CFG.ENDPOINT in index.html to your Worker URL, (4) re-upload. Until then use pathways, careers and official links.'
   :(e&&e.name==='AbortError')?'The AI took too long. Please try again.'
   :msg.includes('quota')||msg.includes('429')
   ?'The free AI quota appears exhausted or rate-limited. Please try again later. Use the official links on this site for important decisions. This site does not switch to a paid plan automatically.'
   :'The AI could not answer right now. Please try again, and use the official links on this page.';
  if(rt)rt.style.display='inline-block';
 }
 if(b)b.disabled=false;draw(key);
}
function retryLast(key,focus){const q=LASTQ[key];if(!q)return;const h=CH[key]||[];if(h.length>=2&&h[h.length-1].r==='a'){h.pop();h.pop()}send(key,focus,q)}
function opt(i){const k='o'+i;const p=pw();return`<p><a href="#home">← Back</a></p><h1>${O[i].i} ${O[i].t}</h1><p class="m">${esc(ctx())} · ${ver()}</p>${p?sec(p,i):'<p class="m">Select a pathway from Pathways first.</p>'}${chat(k,O[i].t)}`}

function route(){
 const h=location.hash.slice(1)||'home';
 let m,t='What If I Choose This?',d='Explore education pathways in India: exams, degrees, colleges, careers and official links.';
 if(m=h.match(/^opt-([0-5])$/)){$('#app').innerHTML=opt(+m[1]);draw('o'+m[1]);t=O[+m[1]].t+' – '+t}

 else if(m=h.match(/^career-([a-z0-9-]+)$/)){if(!crFind(m[1])){$('#app').innerHTML=become()}else{$('#app').innerHTML=careerPage(m[1]);t=crFind(m[1]).n+' – career path';d=crFind(m[1]).inv}}
 else if(h==='cmp'){$('#app').innerHTML=cmp();t='Compare pathways – '+t}
 else if(h==='ccmp'){$('#app').innerHTML=ccmp();t='Compare careers – '+t}
 else if(h==='careers'){$('#app').innerHTML=careers();t='Careers by category – '+t}
